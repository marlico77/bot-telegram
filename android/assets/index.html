<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; font-src 'self'; base-uri 'none'; form-action 'none'">
  <title>MarlicoBot</title>
  <link rel="stylesheet" href="app.css">
  <link rel="stylesheet" href="theme.css">
</head>
<body>
  <div id="app"></div>
  <div id="required-update" class="required-update" role="dialog" aria-modal="true" aria-labelledby="required-title" hidden>
    <section class="card pad"><h2 id="required-title">Atualização necessária</h2><p id="required-status"></p><p>Instale a versão oficial para continuar. Seus dados salvos serão mantidos.</p><div class="page-actions"><button class="btn" data-action="checkUpdates">Verificar novamente</button><button class="btn primary" data-action="downloadUpdate">Baixar atualização</button><button class="btn" data-action="installUpdate">Instalar download</button></div></section>
  </div>
  <div id="toast-container" aria-live="polite"></div>
  <script src="icons.js"></script>
  <script src="app.js"></script>
</body>
</html>
